<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-sage.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Hammer — Woodpecker Trainer</title>
    <script>
      // Applica il tema prima del primo paint, per evitare un flash del tema sbagliato.
      ;(function () {
        try {
          var stored = localStorage.getItem('chess-hammer-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
